<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>文字→マシン語(UTF-8) 変換器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        .output { background: #f4f4f4; padding: 15px; border-radius: 5px; word-break: break-all; font-family: monospace; }
        h3 { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>UTF-8 文字→マシン語変換器</h2>
    <p>文字を入力すると、即座に2進数（バイナリ）と16進数に変換します。</p>
    
    <textarea id="input" placeholder="ここに日本語や文字を入力してください"></textarea>

    <h3>2進数（マシン語データ形式）:</h3>
    <div id="binary" class="output">0110...</div>

    <h3>16進数（HEX）:</h3>
    <div id="hex" class="output">0x...</div>

    <script>
        const input = document.getElementById('input');
        const binaryDiv = document.getElementById('binary');
        const hexDiv = document.getElementById('hex');

        input.addEventListener('input', () => {
            const text = input.value;
            if (!text) {
                binaryDiv.innerText = '';
                hexDiv.innerText = '';
                return;
            }

            // UTF-8でエンコード
            const encoder = new TextEncoder();
            const view = encoder.encode(text);

            let binaryResult = "";
            let hexResult = "";

            view.forEach(b => {
                // 2進数に変換（8bit埋め）
                binaryResult += b.toString(2).padStart(8, '0') + " ";
                // 16進数に変換
                hexResult += b.toString(16).toUpperCase().padStart(2, '0') + " ";
            });

            binaryDiv.innerText = binaryResult;
            hexDiv.innerText = hexResult;
        });
    </script>
</body>
</html>
