<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <textarea id="input"></textarea>
  <button id="copy">コピー</button>
  <div id="box" style="white-space: pre-wrap;"></div>

  <script>
    const input = document.getElementById("input");
    const box = document.getElementById("box");
    const copyBtn = document.getElementById("copy");

    input.addEventListener("input", e => {
      let text = e.target.value
        .replaceAll("body", "TorsoNode")
        .replaceAll("head", "HeadMesh")
        .replaceAll("rightArm", "ArmRightMesh")
        .replaceAll("leftArm", "ArmLeftMesh")
        .replaceAll("rightLeg", "LegRightMesh")
        .replaceAll("leftLeg", "LegLeftMesh");

      text = text.replace(/-?\d+\.\d+/g, num => {
        return Math.floor(parseFloat(num) * 100) / 100;
      });

      box.textContent = text;
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(box.textContent);
    });
  </script>
</body>
</html>
